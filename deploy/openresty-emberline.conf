# 余烬防线：前线 07 — Godot 4.7 Web（nothreads）
# 不要占 devops9527.dpdns.org 的 80/443（主域名给别的用）。
# 和其他站一样走独立端口，证书仍复用该域名（有效至 2026-10-29）。
# 玩：https://devops9527.dpdns.org:9982/
server {
    listen 9982 ssl;
    listen [::]:9982 ssl;
    http2 on;
    server_name devops9527.dpdns.org;

    ssl_certificate /www/sites/devops9527.dpdns.org/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/devops9527.dpdns.org/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /www/sites/emberline/index;
    index index.html;

    access_log /www/sites/emberline/log/access.log;
    error_log  /www/sites/emberline/log/error.log;

    types {
        text/html                             html htm;
        text/javascript                       js mjs;
        text/css                              css;
        application/wasm                      wasm;
        application/octet-stream              pck;
        image/png                             png;
        application/json                      json map;
        image/x-icon                          ico;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm;

    location ~* \.(wasm|pck|js|png)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
