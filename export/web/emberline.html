<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>余烬防线：前线 07</title>
$GODOT_HEAD_INCLUDE
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  background: #0b0d12;
  overflow: hidden;
  color: #e8e0d4;
  font-family: "Noto Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}
#canvas {
  display: block;
  width: 100%;
  height: 100%;
  height: 100dvh;
  touch-action: none;
}
#canvas:focus { outline: none; }
#status {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px;
  background: #0b0d12;
}
#status[data-mode="hidden"] { display: none; }
#status-label {
  font-size: 18px;
  letter-spacing: 0.08em;
}
#status-progress {
  width: min(420px, 70%);
  height: 10px;
}
#status-notice {
  display: none;
  max-width: min(520px, 86%);
  padding: 12px 16px;
  border: 1px solid #9b3943;
  border-radius: 8px;
  background: #5b3943;
  color: #e0e0e0;
  line-height: 1.4;
  text-align: center;
  white-space: pre-wrap;
}
#status[data-mode="notice"] #status-progress { display: none; }
#status[data-mode="notice"] #status-notice { display: block; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="1">Your browser does not support the canvas tag.</canvas>
<noscript>需要启用 JavaScript 才能运行余烬防线。</noscript>
<div id="status" data-mode="progress">
  <div id="status-label">加载中…</div>
  <progress id="status-progress"></progress>
  <div id="status-notice"></div>
</div>
<script src="$GODOT_URL"></script>
<script>
window.emberlineFullscreen = {
  toggle: function () {
    var el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen();
    else if (document.exitFullscreen) document.exitFullscreen();
  }
};

var GODOT_CONFIG = $GODOT_CONFIG;
var GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
var statusEl = document.getElementById("status");
var statusLabel = document.getElementById("status-label");
var statusProgress = document.getElementById("status-progress");
var statusNotice = document.getElementById("status-notice");

function setStatusMode(mode) {
  statusEl.setAttribute("data-mode", mode);
}

function displayFailureNotice(err) {
  console.error(err);
  var text = "启动失败";
  if (err instanceof Error) text = err.message;
  else if (typeof err === "string") text = err;
  statusNotice.textContent = text;
  statusLabel.textContent = "无法启动";
  setStatusMode("notice");
}

if (typeof Engine !== "function") {
  displayFailureNotice("Engine is not defined — Godot index.js did not load before boot.");
} else {
  var missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    displayFailureNotice("缺少运行所需能力：\n" + missing.join("\n"));
  } else {
    var engine = new Engine(GODOT_CONFIG);
    engine.startGame({
      canvas: document.getElementById("canvas"),
      onProgress: function (current, total) {
        if (current > 0 && total > 0) {
          statusProgress.value = current;
          statusProgress.max = total;
          statusLabel.textContent = "加载中 " + Math.min(100, Math.floor((current / total) * 100)) + "%";
        }
      },
      onPrintError: function (text) {
        console.error(text);
      }
    }).then(function () {
      console.log("emberline boot");
      setStatusMode("hidden");
    }, displayFailureNotice);
  }
}
</script>
</body>
</html>
