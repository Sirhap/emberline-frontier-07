<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>余烬防线：前线 07</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  background: #0b0d12;
  overflow: hidden;
}
#canvas {
  display: block;
  width: 100%;
  height: 100%;
  height: 100dvh;
  touch-action: none;
}
</style>
</head>
<body>
<canvas id="canvas" tabindex="1"></canvas>
<script>
window.emberlineFullscreen = {
  toggle: function () {
    var el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen();
    else if (document.exitFullscreen) document.exitFullscreen();
  }
};
var engine = new Engine($GODOT_CONFIG);
engine.startGame({ canvas: document.getElementById("canvas") }).then(function () {
  console.log("emberline boot");
});
</script>
<script src="$GODOT_URL"></script>
</body>
</html>
